[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "econductor"
version = "0.1.0"
description = "An offline-first economics coding agent for Apple Silicon"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "typer>=0.16,<1", "textual>=3,<9", "rich>=14,<15",
  "huggingface-hub>=0.34,<2", "keyring>=25,<26", "platformdirs>=4,<5",
  "duckdb>=1.3,<2", "pandas>=2.2,<3", "pyarrow>=20,<24",
  "pyreadstat>=1.3,<2", "openpyxl>=3.1,<4", "pypdf>=6,<7",
  "statsmodels>=0.14,<1", "matplotlib>=3.10,<4",
  "mlx-lm>=0.31,<1; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
econductor = "econductor.cli:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["sandbox: requires working macOS sandbox-exec", "large: opt-in large data workload"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["src/econductor"]
